<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 8-ray geometric mark - CM Yao brand symbol -->
  <g stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.6">
    <!-- Cardinal rays (N, E, S, W) -->
    <line x1="50" y1="50" x2="50" y2="15" />
    <line x1="50" y1="50" x2="85" y2="50" />
    <line x1="50" y1="50" x2="50" y2="85" />
    <line x1="50" y1="50" x2="15" y2="50" />
    
    <!-- Diagonal rays (NE, SE, SW, NW) - shorter -->
    <line x1="50" y1="50" x2="72" y2="28" />
    <line x1="50" y1="50" x2="72" y2="72" />
    <line x1="50" y1="50" x2="28" y2="72" />
    <line x1="50" y1="50" x2="28" y2="28" />
  </g>
  
  <!-- Center dot -->
  <circle cx="50" cy="50" r="3" fill="currentColor" opacity="0.8" />
</svg>
